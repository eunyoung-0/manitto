<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리들의 마니또</title>
<meta property="og:title" content="🎁 우리들의 마니또">
<meta property="og:description" content="링크를 눌러 마니또에 참여하세요!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6efe3; --card:#fffaf2; --ink:#2b2420; --muted:#7a6d62; --line:#e6d9c6;
    --green:#1f4d3a; --green2:#2d6b51; --red:#c8432f; --gold:#d9a441; --soft:#efe4d2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px}
  header{background:var(--green);color:#fdf6ea;border-radius:22px;padding:22px 20px 18px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 8px,transparent 8px 16px)}
  h1{font-family:"Jua",sans-serif;font-weight:400;font-size:30px;margin:0 0 4px;letter-spacing:.5px}
  .sub{opacity:.85;font-size:14px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
  .chip.gold{background:var(--gold);color:#2b2420}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
  h2{font-family:"Jua",sans-serif;font-weight:400;font-size:20px;margin:0 0 10px;color:var(--green)}
  .muted{color:var(--muted);font-size:13px}
  label{display:block;font-size:13px;font-weight:500;margin:10px 0 4px;color:var(--muted)}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:70px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green2);outline-offset:0;border-color:transparent}
  .row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--green);color:#fff;font-size:15px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.full{width:100%;margin-top:14px}
  button.red{background:var(--red)}
  button.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
  button.small{padding:6px 10px;font-size:13px;border-radius:9px}
  .players{list-style:none;margin:0;padding:0}
  .players li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
  .players li:first-child{border-top:0}
  .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:"Jua";font-size:18px;color:#fff;flex:none}
  .pname{font-weight:700}
  .grow{flex:1;min-width:0}
  .wish{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ok{color:var(--green2);font-weight:700;font-size:13px}
  .target{text-align:center;padding:26px 10px 20px;background:var(--green);color:#fdf6ea;border-radius:18px;margin-top:14px;position:relative;overflow:hidden}
  .target .lab{font-size:14px;opacity:.85}
  .target .big{font-family:"Jua";font-size:44px;margin:4px 0;color:var(--gold)}
  .target .w{font-size:14px;opacity:.9;margin-top:6px}
  .ribbon{position:absolute;inset:0 auto 0 50%;width:18px;transform:translateX(-50%);background:rgba(200,67,47,.35);pointer-events:none}
  .ribbon2{position:absolute;inset:50% 0 auto 0;height:18px;transform:translateY(-50%);background:rgba(200,67,47,.35);pointer-events:none}
  .target>*:not(.ribbon):not(.ribbon2){position:relative}
  .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .opt{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:500}
  .opt.on{background:var(--gold);border-color:var(--gold);color:#2b2420;font-weight:700}
  .pair{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px dashed var(--line);font-weight:700}
  .pair:first-child{border-top:0}
  .arrow{color:var(--red);font-size:18px}
  .res{margin-left:auto;font-size:13px;font-weight:500}
  .banner{background:var(--soft);border-radius:12px;padding:12px;font-size:14px;margin-top:12px}
  .modal{position:fixed;inset:0;background:rgba(30,25,20,.55);display:grid;place-items:center;padding:20px;z-index:10}
  .modal .box{background:var(--card);border-radius:18px;padding:20px;max-width:380px;width:100%}
  .modal .btns{display:flex;gap:10px;margin-top:16px}.modal .btns button{flex:1}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
  .center{text-align:center}
  .winner{font-family:"Jua";font-size:22px;color:var(--green)}
  a{color:var(--green2)}
  /* 일정 */
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
  .tl li:first-child{border-top:0}
  .tl .ic{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
  .tl .d{margin-left:auto;font-family:"Jua";font-size:18px;color:var(--red);white-space:nowrap}
  .tl li.past .d{color:var(--muted)}
  .budget{font-family:"Jua";font-size:26px;color:var(--green)}
  /* 공개의 날 카운트다운 */
  .count{display:flex;justify-content:center;gap:8px;margin:8px 0 4px}
  .count div{background:var(--green);color:var(--gold);border-radius:12px;min-width:62px;padding:8px 6px;font-family:"Jua";font-size:26px;line-height:1.1}
  .count small{display:block;font-family:"Noto Sans KR";font-size:11px;color:#fdf6ea;opacity:.8}
  /* 쪽지 */
  .tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:12px}
  .tabs button{flex:1;background:transparent;color:var(--muted);padding:9px 6px;font-size:14px;position:relative}
  .tabs button.on{background:#fff;color:var(--green);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .badge{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px;vertical-align:1px}
  .thread{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:4px 2px}
  .msg{max-width:80%;padding:9px 12px;border-radius:14px;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .msg .who{font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
  .msg .t{font-size:11px;opacity:.6;margin-top:3px;text-align:right}
  .msg.mine{align-self:flex-end;background:var(--green);color:#fdf6ea;border-bottom-right-radius:4px}
  .msg.theirs{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .compose{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
  .compose textarea{min-height:46px;height:46px}
  .compose button{flex:none}
  .copy{display:flex;gap:8px;margin-top:10px}.copy input{font-size:13px}.copy button{white-space:nowrap;flex:none}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .5s ease-out both}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎁 우리들의 마니또</h1>
    <div class="sub">멀리 있어도 같이 뽑는 마니또</div>
    <div class="meta" id="meta"></div>
  </header>
  <main id="app"><div class="card center muted">불러오는 중…</div></main>
</div>
<div id="layer"></div>

<script type="module">
import { firebaseConfig } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc,
         onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => (Number(n)||0).toLocaleString("ko-KR") + "원";
const COLORS = ["#c8432f","#2d6b51","#d9a441","#4a6fa5","#8a4f7d","#3f8f8b","#b5651d","#5b6b2f","#a33b5c","#356a8a"];
const colorOf = id => { let h=0; for (const c of id) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder(), dec = new TextDecoder();
const ls = { get(k){ try{return localStorage.getItem(k)}catch{return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch{} } };
const randId = (n=12) => { const a="abcdefghijkmnpqrstuvwxyz23456789"; const r=crypto.getRandomValues(new Uint8Array(n)); return [...r].map(x=>a[x%a.length]).join(""); };
function randInt(n){ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }
async function sha(s){ return b64(await crypto.subtle.digest("SHA-256", enc.encode(s))); }
const hhmm = ts => { const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2800);
}
function confirmBox(title, body, okLabel="확인", danger=false){
  return new Promise(res=>{
    const L = $("#layer");
    L.innerHTML = `<div class="modal"><div class="box"><h2>${esc(title)}</h2><div class="muted" style="font-size:14px">${body}</div>
      <div class="btns"><button class="ghost" id="mNo">취소</button><button class="${danger?"red":""}" id="mOk">${esc(okLabel)}</button></div></div></div>`;
    $("#mNo").onclick=()=>{L.innerHTML="";res(false)};
    $("#mOk").onclick=()=>{L.innerHTML="";res(true)};
  });
}

/* ---------- crypto ----------
   - 참여할 때: 각자 RSA 키 쌍을 만들고, 개인키는 PIN으로 잠가서 저장
   - 뽑기: 준 사람(천사) → 받는 사람마다 비밀 쪽지함(id + AES 키)을 만들고
           천사에게는 {대상, 쪽지함}, 받는 사람에게는 {쪽지함}만 각자의 공개키로 암호화
   → DB를 열어봐도 누가 누구를 뽑았는지, 쪽지 내용이 뭔지 알 수 없어요. */
const ITER = 300000;
async function pinKey(pin, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function makeKeys(pin){
  const kp = await crypto.subtle.generateKey({name:"RSA-OAEP", modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:"SHA-256"}, true, ["encrypt","decrypt"]);
  const pub = await crypto.subtle.exportKey("jwk", kp.publicKey);
  const pkcs8 = await crypto.subtle.exportKey("pkcs8", kp.privateKey);
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await pinKey(pin, salt), pkcs8);
  return { pub: JSON.stringify(pub), encPriv: b64(ct), salt: b64(salt), iv: b64(iv) };
}
async function unlock(p, pin){
  const pkcs8 = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(p.iv)}, await pinKey(pin, unb64(p.salt)), unb64(p.encPriv));
  return crypto.subtle.importKey("pkcs8", pkcs8, {name:"RSA-OAEP", hash:"SHA-256"}, false, ["decrypt"]);
}
async function sealFor(p, obj){
  const key = await crypto.subtle.importKey("jwk", JSON.parse(p.pub), {name:"RSA-OAEP", hash:"SHA-256"}, false, ["encrypt"]);
  return b64(await crypto.subtle.encrypt({name:"RSA-OAEP"}, key, enc.encode(JSON.stringify(obj))));
}
async function openSealed(priv, s){ return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"RSA-OAEP"}, priv, unb64(s)))); }
const boxKey = k => crypto.subtle.importKey("raw", unb64(k), "AES-GCM", false, ["encrypt","decrypt"]);
async function sealNote(key, text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(text))) };
}
async function openNote(key, n){ return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(n.iv)}, key, unb64(n.ct))); }

/* ---------- state ---------- */
let fs=null, ROOM="";
const R = {
  doc: p => doc(fs, `rooms/${ROOM}/${p}`),
  col: p => collection(fs, `rooms/${ROOM}/${p}`),
};
let game=null, players=[], gotG=false, gotP=false;
let me=null;          // {pid, priv, target, out:{m,key}, inn:{m,key}}
let notes=[];         // 복호화된 쪽지 [{id, box, from, at, text}]
let unsubNotes=null;
let editReveal=false, lastClosed=null;
let draftGuess=null, tab="out", busy=false, isAdmin=false, lastEff=null;

const byId = id => players.find(p=>p.id===id);
const nameOf = id => byId(id)?.name || "?";
function revealTime(){
  if (!game?.revealAt) return null;
  return new Date(`${game.revealAt}T${game.revealTime||"00:00"}:00`);
}
// 공개 시각이 지나면 자동으로 공개 상태가 돼요
function status(){
  const s = game?.status || "joining";
  if (s==="drawn"){ const t=revealTime(); if (t && Date.now()>=t.getTime()) return "revealed"; }
  return s;
}
// 추리는 공개 시각 30분 전에 마감돼요
const GUESS_CLOSE_MIN = 30;
function guessDeadline(){ const t=revealTime(); return t ? new Date(t.getTime() - GUESS_CLOSE_MIN*60000) : null; }
function guessClosed(){ const d=guessDeadline(); return status()!=="drawn" || (d && Date.now()>=d.getTime()); }
function guessInfo(){
  const d = guessDeadline();
  if (guessClosed()) return `<b style="color:var(--red)">⏰ 추리가 마감됐어요.</b> 공개 시각을 기다려 주세요!`;
  return d ? `<b>${hhmm(d.getTime())}</b>까지 몇 번이든 바꿀 수 있어요. (공개 ${GUESS_CLOSE_MIN}분 전 마감)` : `공개 전까지 몇 번이든 바꿀 수 있어요.`;
}
function daysUntil(dateStr){
  if (!dateStr) return null;
  const d = new Date(dateStr+"T00:00:00"), t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
const ddayText = n => n===null ? "" : n>0 ? `D-${n}` : n===0 ? "D-DAY" : `D+${-n}`;
function budgetText(){
  const a=+game?.budgetMin||0, b=+game?.budgetMax||0;
  if (a && b) return `${won(a)} ~ ${won(b)}`;
  if (b) return `${won(b)} 이내`;
  if (a) return `${won(a)} 이상`;
  return "";
}

/* ---------- render ---------- */
function keepInputs(fn){
  const saved = {};
  document.querySelectorAll("[data-keep]").forEach(el=>{ saved[el.id]=el.value; });
  const focus = document.activeElement?.id;
  const th = $("#thread"); const atBottom = th ? (th.scrollHeight - th.scrollTop - th.clientHeight < 40) : true;
  fn();
  for (const [id,v] of Object.entries(saved)){ const el=document.getElementById(id); if(el && v!=="") el.value=v; }
  if (focus) document.getElementById(focus)?.focus();
  const th2 = $("#thread"); if (th2 && atBottom) th2.scrollTop = th2.scrollHeight;
}

function renderMeta(){
  const st = status(), chips = [];
  chips.push(`<span class="chip">${st==="joining"?"참여 받는 중":st==="drawn"?"🤫 비밀 진행 중":"🎉 결과 공개"}</span>`);
  const bt = budgetText(); if (bt) chips.push(`<span class="chip gold">💰 ${bt}</span>`);
  const d = daysUntil(game?.revealAt);
  if (d!==null && st!=="revealed") chips.push(`<span class="chip">공개 ${ddayText(d)}</span>`);
  chips.push(`<span class="chip">${players.length}명</span>`);
  $("#meta").innerHTML = chips.join("");
}

function render(){
  if (!ROOM) return;
  renderMeta();
  lastEff = status(); lastClosed = guessClosed();
  keepInputs(()=>{
    const st = status();
    let h = "";
    if (st==="joining") h = viewJoining();
    else if (st==="drawn") h = viewDrawn();
    else h = viewRevealed();
    h += shareCard();
    h += adminCard();
    if (isAdmin) h += `<div class="center" style="margin-top:22px"><button class="ghost small" id="btnReset">처음부터 다시 하기 (방장)</button></div>`;
    $("#app").innerHTML = h;
  });
  bind();
}

let showAdminCode=false, adminInput=false;
function adminCard(){
  if (!game?.adminHash) return "";
  if (isAdmin){
    const code = ls.get("manitto:"+ROOM+":admin")||"";
    return `<div class="card"><h2>👑 방장 코드</h2>
      <div class="muted">방장 권한은 이 휴대폰 브라우저에만 저장돼 있어요. 휴대폰을 바꾸거나 기록을 지워도 이 코드가 있으면 되찾을 수 있어요. <b>친구들에게는 보여주지 마세요.</b></div>
      ${showAdminCode
        ? `<div class="copy"><input id="adminCode" readonly value="${esc(code)}"><button class="small" id="btnCopyAdmin">복사</button></div>`
        : `<button class="ghost full" id="btnShowAdmin">코드 보기</button>`}</div>`;
  }
  return `<div class="center" style="margin-top:18px">${adminInput
    ? `<div class="card" style="text-align:left"><h2>👑 방장 권한 되찾기</h2><label for="inAdmin">방장 코드</label><input id="inAdmin" data-keep autocomplete="off">
       <div class="row" style="margin-top:10px"><button class="ghost" id="btnAdminNo">취소</button><button id="btnAdminOk">확인</button></div></div>`
    : `<button class="ghost small" id="btnAdminIn">방장이신가요?</button>`}</div>`;
}
async function claimAdmin(){
  const code = ($("#inAdmin").value||"").trim();
  if (!code) throw new Error("방장 코드를 입력해 주세요.");
  if ((await sha(code)) !== game?.adminHash) throw new Error("방장 코드가 맞지 않아요.");
  ls.set("manitto:"+ROOM+":admin", code);
  isAdmin = true; adminInput = false;
  toast("방장 권한을 되찾았어요 👑");
}

function shareCard(){
  return `<div class="card"><h2>친구 초대 링크</h2><div class="muted">이 주소를 단톡방에 공유하세요. 주소를 아는 사람만 들어올 수 있어요.</div>
    <div class="copy"><input id="shareUrl" readonly value="${esc(location.href)}"><button class="small" id="btnCopy">복사</button></div></div>`;
}

function playerRow(p, extra=""){
  return `<li><div class="av" style="background:${colorOf(p.id)}">${esc((p.name||"?").slice(0,1))}</div>
    <div class="grow"><div class="pname">${esc(p.name)}</div>${p.wish?`<div class="wish">🎀 ${esc(p.wish)}</div>`:""}</div>${extra}</li>`;
}

function scheduleCard(){
  const items = [];
  if (game?.drawnAt) items.push({ic:"🎲", t:"마니또 뽑기", sub:hhmm(game.drawnAt), d:null, past:true});
  if (game?.sendBy) { const n=daysUntil(game.sendBy); items.push({ic:"📦", t:"선물 발송 마감", sub:game.sendBy, d:n, past:n<0}); }
  if (game?.revealAt) { const n=daysUntil(game.revealAt); items.push({ic:"🎉", t:"공개의 날", sub:`${game.revealAt} ${game.revealTime||"00:00"}`, d:n, past:status()==="revealed"}); }
  const bt = budgetText();
  if (!items.length && !bt) return "";
  return `<div class="card"><h2>💰 예산 & 📅 일정</h2>
    ${bt?`<div class="muted">선물 예산</div><div class="budget">${bt}</div>`:""}

function unread(box, other){
  const seen = +ls.get("manitto:"+ROOM+":seen:"+box) || 0;
  return notes.filter(n=>n.box===box && n.from===other && n.at>seen).length;
}

function notesCard(){
  if (!me) return "";
  const revealed = status()==="revealed";
  const t = byId(me.target);
  const angelName = revealed ? players.find(p=>p.revealedTarget===me.pid)?.name : null;
  const uIn = unread(me.inn.m, "a");
  const box = tab==="out" ? me.out : me.inn;
  // 쪽지는 선물하는 사람(천사, from "a")만 보낼 수 있어요
  const list = notes.filter(n=>n.box===box.m && n.from==="a").sort((a,b)=>a.at-b.at);
  const angelLabel = angelName ? `🎁 ${angelName} (천사)` : "🎁 비밀 천사";
  const hint = tab==="out"
    ? `<b>${esc(t?.name)}</b>님에게 이름 없이 쪽지가 가요. 말투로 들키지 않게 조심! 😎`
    : (angelName ? `나를 챙겨준 천사는 <b>${esc(angelName)}</b>님이었어요!` : `나를 챙기는 천사가 보낸 쪽지예요. 답장은 할 수 없으니 공개의 날에 직접 고마움을 전해 주세요.`);
  return `<div class="card"><h2>💌 익명 쪽지</h2>
    <div class="tabs">
      <button id="tabOut" class="${tab==="out"?"on":""}">✍️ 보낸 쪽지</button>
      <button id="tabIn" class="${tab==="in"?"on":""}">📬 받은 쪽지${uIn&&tab!=="in"?`<span class="badge">${uIn}</span>`:""}</button>
    </div>
    <div class="muted" style="margin-bottom:8px">${hint}</div>
    <div class="thread" id="thread">${list.length? list.map(n=> tab==="out"
      ? `<div class="msg mine">${esc(n.text)}<div class="t">${hhmm(n.at)}</div></div>`
      : `<div class="msg theirs"><div class="who">${esc(angelLabel)}</div>${esc(n.text)}<div class="t">${hhmm(n.at)}</div></div>`
    ).join("") : `<div class="muted center" style="padding:16px 0">${tab==="out"?`${esc(t?.name)}님에게 첫 쪽지를 보내 보세요 ✍️`:"아직 천사에게서 온 쪽지가 없어요"}</div>`}</div>
    ${tab==="out" && !revealed ? `<div class="compose"><textarea id="inNote" data-keep maxlength="300"></textarea><button id="btnNote">보내기</button></div>` : ""}
  </div>`;
}

function guessCard(){
  const t = byId(me.target), mp = byId(me.pid);
  const cands = players.filter(p=>p.id!==me.pid);
  const closed = guessClosed();
  const cur = closed ? (mp?.guess ?? null) : (draftGuess ?? mp?.guess ?? null);
  return `<div class="card"><h2>🕵️ 추리 게임</h2>
    <div class="muted">나를 몰래 챙기는 천사는 누구일까요? 천사가 보낸 쪽지 말투가 힌트예요. ${guessInfo()}</div>
    <div class="opts">${cands.map(p=>`<button class="opt ${cur===p.id?"on":""}" data-guess="${esc(p.id)}" ${closed?"disabled":""}>${esc(p.name)}</button>`).join("")}</div>
    ${closed
      ? `<div class="banner center">${mp?.guess?`내 추리: <b>${esc(nameOf(mp.guess))}</b> 🔒`:"추리하지 않았어요"}</div>`
      : `<button class="full" id="btnGuess" ${!cur || cur===mp?.guess?"disabled":""}>${mp?.guess && cur===mp.guess?"추리 저장됨 ✓":"이 사람으로 추리하기"}</button>`}</div>`;
}

function countdownCard(){
  const rt = revealTime();
  let inner;
  if (!rt) inner = `<div class="muted">공개일이 정해지지 않았어요. ${isAdmin?"아래 버튼으로 원할 때 공개할 수 있어요.":"방장이 공개해 줄 거예요."}</div>`;
  else inner = `<div class="count" id="count">${countParts(rt)}</div><div class="muted">${esc(game.revealAt)} ${esc(game.revealTime||"00:00")}에 자동으로 공개돼요</div>`;
  const edit = editReveal ? `<div style="text-align:left;margin-top:12px">
      <div class="row">
        <div><label for="inRDate">공개 날짜</label><input id="inRDate" data-keep type="date" value="${esc(game?.revealAt||"")}"></div>
        <div><label for="inRTime">공개 시각</label><input id="inRTime" data-keep type="time" value="${esc(game?.revealTime||"20:00")}"></div>
      </div>
      <div class="row" style="margin-top:10px"><button class="ghost" id="btnREditNo">취소</button><button id="btnREditOk">저장</button></div></div>`
    : `<button class="ghost small" id="btnREdit" style="margin-top:10px">🕗 공개 날짜·시각 바꾸기</button>`;
  if (!isAdmin) return `<div class="card center"><h2>🎉 공개의 날</h2>${inner}</div>`;
  return `<div class="card center"><h2>🎉 공개의 날</h2>${inner}${edit}
    <button class="ghost full" id="btnReveal">지금 바로 공개하기 (방장)</button></div>`;
}
function countParts(rt){
  let s = Math.max(0, Math.floor((rt - Date.now())/1000));
  const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60);
  return `<div>${d}<small>일</small></div><div>${h}<small>시간</small></div><div>${m}<small>분</small></div>`;
}

function viewRevealed(){
  let h = "";
  const known = {};
  players.forEach(p=>{ if (p.revealedTarget) known[p.id]=p.revealedTarget; });
  const angelOf = {}; Object.entries(known).forEach(([g,r])=>angelOf[r]=g);
  const doneCount = Object.keys(known).length, all = doneCount===players.length && players.length>0;

  h += `<div class="card center"><h2>🎉 공개의 날!</h2><div class="muted">${all?"모든 짝이 밝혀졌어요!":`각자 PIN을 입력하면 짝이 하나씩 밝혀져요 (${doneCount}/${players.length})`}</div></div>`;
  h += `<div class="card"><h2>🎁 누가 누구를 챙겼을까</h2>`;
  h += players.map(p=> known[p.id]
    ? `<div class="pair pop"><span>${esc(p.name)}</span><span class="arrow">➜</span><span>${esc(nameOf(known[p.id]))}</span></div>`
    : `<div class="pair"><span>${esc(p.name)}</span><span class="arrow">➜</span><span class="muted">❓ PIN 입력 기다리는 중</span></div>`).join("");
  h += `</div>`;

  if (!all) h += loginCard(me && byId(me.pid)?.revealedTarget ? "내 결과는 공개됐어요. 같이 있는 친구도 여기서 PIN을 입력할 수 있어요." : "PIN을 입력하면 내가 누구를 챙겼는지 공개돼요.");

  h += `<div class="card"><h2>🕵️ 추리 결과</h2>`;
  const correct = [];
  h += players.map(p=>{
    const a = angelOf[p.id]; let res;
    if (!p.guess) res = `<span class="res muted">추리 안 함</span>`;
    else if (!a) res = `<span class="res muted">${esc(nameOf(p.guess))}? · 확인 중</span>`;
    else if (a===p.guess){ res = `<span class="res ok">${esc(nameOf(p.guess))} 정답! 🎯</span>`; correct.push(p.name); }
    else res = `<span class="res" style="color:var(--red)">${esc(nameOf(p.guess))} 땡</span>`;
    return `<div class="pair"><span>${esc(p.name)}</span>${res}</div>`;
  }).join("");
  if (all) h += `<div class="banner center">${correct.length?`<div class="winner">🏆 명탐정: ${correct.map(esc).join(", ")}</div>`:`<div class="winner">아무도 못 맞혔어요 😆</div><div class="muted">다들 완벽하게 숨었네요!</div>`}</div>`;
  h += `</div>`;

  if (me) h += notesCard();
  h += scheduleCard();
  return h;
}

/* ---------- actions ---------- */
function plainBtn(id, fn){ const el=document.getElementById(id); if (el) el.onclick = fn; }
function bind(){
  const on = (id, fn) => { const el=document.getElementById(id); if (el) el.onclick = () => guard(fn); };
  on("btnSettings", saveSettings); on("btnJoin", join); on("btnDraw", draw); on("btnLogin", login);
  on("btnGuess", saveGuess); on("btnReveal", reveal); on("btnReset", resetAll); on("btnNote", sendNote); on("btnREditOk", saveRevealTime);
  plainBtn("btnREdit", ()=>{ editReveal=true; render(); });
  plainBtn("btnShowAdmin", ()=>{ showAdminCode=true; render(); });
  plainBtn("btnAdminIn", ()=>{ adminInput=true; render(); });
  plainBtn("btnAdminNo", ()=>{ adminInput=false; render(); });
  on("btnAdminOk", claimAdmin);
  plainBtn("btnCopyAdmin", async ()=>{ try{ await navigator.clipboard.writeText($("#adminCode").value); toast("방장 코드를 복사했어요. 안전한 곳에 메모해 두세요!"); }catch{ $("#adminCode").select(); toast("길게 눌러 복사해 주세요"); } });
  plainBtn("btnREditNo", ()=>{ editReveal=false; render(); });
  const plain = (id, fn) => { const el=document.getElementById(id); if (el) el.onclick = fn; };
  plain("btnLogout", ()=>{ lock(); render(); });
  plain("tabOut", ()=>{ tab="out"; markSeen(); render(); });
  plain("tabIn", ()=>{ tab="in"; markSeen(); render(); });
  plain("btnCopy", async ()=>{ try{ await navigator.clipboard.writeText(location.href); toast("링크를 복사했어요"); }catch{ $("#shareUrl").select(); toast("길게 눌러 복사해 주세요"); } });
  document.querySelectorAll("[data-leave]").forEach(b=>b.onclick=()=>guard(()=>leave(b.dataset.leave)));
  document.querySelectorAll("[data-guess]").forEach(b=>b.onclick=()=>{ if (guessClosed()) return; draftGuess=b.dataset.guess; render(); });
  const lp = $("#inLoginPin"); if (lp) lp.onkeydown = e=>{ if(e.key==="Enter") guard(login); };
  if (me) markSeen();
}
async function guard(fn){
  if (busy) return; busy=true;
  try { await fn(); }
  catch(e){ console.error(e); toast(e?.message?.length<80 ? e.message : "문제가 생겼어요. 다시 시도해 주세요."); }
  finally { busy=false; render(); }
}
function markSeen(){
  if (!me) return;
  const box = tab==="out" ? me.out.m : me.inn.m;
  const other = tab==="out" ? "t" : "a";
  const last = Math.max(0, ...notes.filter(n=>n.box===box && n.from===other).map(n=>n.at));
  const k = "manitto:"+ROOM+":seen:"+box;
  if (last > (+ls.get(k)||0)) ls.set(k, String(last));
}

function needAdmin(){ if (!isAdmin) throw new Error("방장만 할 수 있어요."); }
async function saveSettings(){
  needAdmin();
  const budgetMin = Math.max(0, parseInt($("#inBMin").value,10)||0);
  const budgetMax = Math.max(0, parseInt($("#inBMax").value,10)||0);
  if (budgetMin && budgetMax && budgetMin>budgetMax) throw new Error("최소 예산이 최대 예산보다 커요.");
  const sendBy = $("#inSend").value||"", revealAt = $("#inDate").value||"", revealTime = $("#inTime").value||"00:00";
  if (sendBy && revealAt && sendBy>revealAt) throw new Error("발송 마감일은 공개일보다 빨라야 해요.");
  const memo = $("#inMemo").value.trim();
  const ref = R.doc("meta/game");
  const cur = await getDoc(ref);
  const g = cur.exists() ? cur.data() : {};
  if (g.status && g.status!=="joining") throw new Error("이미 뽑기가 끝났어요.");
  await setDoc(ref, {...g, status:"joining", budgetMin, budgetMax, sendBy, revealAt, revealTime, memo});
  toast("저장했어요");
}

async function join(){
  const name = $("#inName").value.trim(), pin = $("#inPin").value, pin2 = $("#inPin2").value, wish = $("#inWish").value.trim();
  if (!name) throw new Error("이름을 입력해 주세요.");
  if (players.some(p=>p.name===name)) throw new Error("같은 이름이 이미 있어요.");
  if (pin.length<4) throw new Error("PIN은 4자리 이상으로 해 주세요.");
  if (pin!==pin2) throw new Error("PIN 두 개가 서로 달라요.");
  if (status()!=="joining") throw new Error("이미 뽑기가 끝났어요.");
  toast("비밀 열쇠 만드는 중…");
  const keys = await makeKeys(pin);
  const ref = await addDoc(R.col("players"), {name, wish, joinedAt: Date.now(), ...keys});
  ls.set("manitto:"+ROOM+":pid", ref.id);
  ["inName","inPin","inPin2","inWish"].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=""; });
  toast(`${name}님, 참여 완료!`);
}

async function leave(pid){
  if (status()!=="joining") return;
  const p = byId(pid);
  const ok = await confirmBox("참여 취소", `<b>${esc(p?.name)}</b>님을 참여자 목록에서 뺄까요?`, "빼기", true);
  if (!ok) return;
  await deleteDoc(R.doc("players/"+pid));
}

async function draw(){
  const ref = R.doc("meta/game");
  const cur = await getDoc(ref);
  const g = cur.exists() ? cur.data() : {};
  if (g.status && g.status!=="joining") throw new Error("이미 뽑았어요!");
  const list = (await getDocs(R.col("players"))).docs.map(d=>({id:d.id, ...d.data()}));
  if (list.length<3) throw new Error("3명 이상 필요해요.");
  const ok = await confirmBox("마니또 뽑기", `<b>${list.map(p=>esc(p.name)).join(", ")}</b> ${list.length}명으로 뽑을게요.<br>뽑은 뒤에는 참여자를 바꿀 수 없어요.${!g.revealAt?"<br><br>⚠️ 공개일이 아직 안 정해졌어요.":""}`, "뽑기!", true);
  if (!ok) return;
  // 자기 자신만 안 걸리게 무작위 배정 (서로 뽑기 허용) — 자기 자신이 나오면 다시 섞어요
  let recvOf;
  do {
    const sh = list.slice();
    for (let i=sh.length-1;i>0;i--){ const j=randInt(i+1); [sh[i],sh[j]]=[sh[j],sh[i]]; }
    recvOf = sh;
  } while (recvOf.some((r,i)=>r.id===list[i].id));
  const assign = {}, inbox = {};
  for (let i=0;i<list.length;i++){
    const giver = list[i], recv = recvOf[i];
    const m = randId(16), k = b64(crypto.getRandomValues(new Uint8Array(32)));
    assign[giver.id] = await sealFor(giver, {t: recv.id, m, k});
    inbox[recv.id]   = await sealFor(recv,  {m, k});
  }
  await setDoc(ref, {...g, status:"drawn", assign, inbox, drawnAt: Date.now()});
  toast("뽑기 완료! 각자 PIN으로 확인하세요 🎁");
}

async function login(){
  const pid = $("#inWho").value, pin = $("#inLoginPin").value;
  if (!pid) throw new Error("이름을 골라 주세요.");
  const p = byId(pid);
  let priv;
  try { priv = await unlock(p, pin); } catch { throw new Error("PIN이 맞지 않아요."); }
  if (!game?.assign?.[pid] || !game?.inbox?.[pid]) throw new Error("뽑기 결과를 찾을 수 없어요.");
  const a = await openSealed(priv, game.assign[pid]);
  const b = await openSealed(priv, game.inbox[pid]);
  me = { pid, priv, target: a.t, out: {m:a.m, key: await boxKey(a.k)}, inn: {m:b.m, key: await boxKey(b.k)} };
  ls.set("manitto:"+ROOM+":pid", pid);
  const pinEl = $("#inLoginPin"); if (pinEl) pinEl.value="";
  draftGuess=null; tab="out";
  subscribeNotes();
  if (status()==="revealed") await publishMine();
}
function lock(){ me=null; draftGuess=null; notes=[]; if (unsubNotes){ unsubNotes(); unsubNotes=null; } }

function subscribeNotes(){
  if (unsubNotes) unsubNotes();
  const boxes = {[me.out.m]: me.out.key, [me.inn.m]: me.inn.key};
  const q = query(R.col("notes"), where("box", "in", Object.keys(boxes)));
  unsubNotes = onSnapshot(q, async snap=>{
    const out = [];
    for (const d of snap.docs){
      const n = d.data();
      try { out.push({id:d.id, box:n.box, from:n.from, at:n.at, text: await openNote(boxes[n.box], n)}); } catch {}
    }
    notes = out;
    if (!busy) render();
  }, e=>console.error(e));
}

async function sendNote(){
  const el = $("#inNote"); const text = el.value.trim();
  if (!me || !text) return;
  if (tab!=="out" || status()!=="drawn") return;
  const sealed = await sealNote(me.out.key, text);
  await addDoc(R.col("notes"), {box: me.out.m, from: "a", at: Date.now(), ...sealed});
  el.value = "";
}

async function saveRevealTime(){
  needAdmin();
  const revealAt = $("#inRDate").value, revealTime = $("#inRTime").value || "20:00";
  if (!revealAt) throw new Error("공개 날짜를 골라 주세요.");
  const when = new Date(`${revealAt}T${revealTime}:00`);
  if (when <= Date.now()) throw new Error("지금보다 나중 시각으로 정해 주세요.");
  if (game?.sendBy && game.sendBy > revealAt) throw new Error("발송 마감일보다 뒤로 정해 주세요.");
  if ((game?.status||"joining")!=="drawn") throw new Error("지금은 바꿀 수 없어요.");
  await updateDoc(R.doc("meta/game"), {revealAt, revealTime});
  editReveal=false;
  toast(`공개 시각을 ${revealAt} ${revealTime}(으)로 바꿨어요`);
}

async function saveGuess(){
  if (!me || !draftGuess) return;
  if (guessClosed()) { draftGuess=null; throw new Error("추리가 마감됐어요 (공개 30분 전)."); }
  await updateDoc(R.doc("players/"+me.pid), {guess: draftGuess});
  draftGuess=null;
  toast("추리를 저장했어요 🕵️");
}

async function reveal(){
  needAdmin();
  const rt = revealTime();
  const notGuessed = players.filter(p=>!p.guess).map(p=>p.name);
  let body = "공개하면 추리를 더 바꿀 수 없어요.";
  if (rt && rt>Date.now()) body = `아직 공개 시각 전이에요. 그래도 지금 공개할까요?<br>`+body;
  if (notGuessed.length) body += `<br><br>아직 추리 안 한 사람: ${notGuessed.map(esc).join(", ")}`;
  if (!(await confirmBox("결과 공개", body, "공개!", true))) return;
  await updateDoc(R.doc("meta/game"), {status:"revealed", revealedAt: Date.now()});
  if (me) await publishMine();
}

async function publishMine(){
  const p = byId(me?.pid);
  if (p && !p.revealedTarget) await updateDoc(R.doc("players/"+me.pid), {revealedTarget: me.target});
}

async function resetAll(){
  if (!(await confirmBox("처음부터 다시", "참여자, 뽑기 결과, 쪽지, 추리가 모두 지워져요. 예산과 일정은 남겨 둘게요.", "모두 지우기", true))) return;
  for (const d of (await getDocs(R.col("notes"))).docs) await deleteDoc(R.doc("notes/"+d.id));
  for (const d of (await getDocs(R.col("players"))).docs) await deleteDoc(R.doc("players/"+d.id));
  const g = game||{};
  await setDoc(R.doc("meta/game"), {status:"joining", budgetMin:g.budgetMin||0, budgetMax:g.budgetMax||0, sendBy:g.sendBy||"", revealAt:g.revealAt||"", revealTime:g.revealTime||"20:00", memo:g.memo||"", adminHash:g.adminHash||""});
  lock();
  toast("새로 시작해요");
}

/* ---------- boot ---------- */
let pendingAuto=false;
async function onData(){
  if (!(gotG && gotP)) return;
  if (game?.adminHash) { const k = ls.get("manitto:"+ROOM+":admin"); isAdmin = !!k && (await sha(k))===game.adminHash; }
  else isAdmin = true;
  if (me && !byId(me.pid)) lock();
  if (status()==="revealed" && me && !byId(me.pid)?.revealedTarget && !pendingAuto){
    pendingAuto=true; publishMine().catch(()=>{}).finally(()=>{pendingAuto=false;});
  }
  if (!busy) render();
}

function landing(){
  $("#meta").innerHTML = "";
  $("#app").innerHTML = `<div class="card center"><h2>새 마니또 방 만들기</h2>
    <div class="muted" style="font-size:14px">방을 만들면 초대 링크가 생겨요. 그 링크를 단톡방에 공유하면 친구들이 로그인 없이 바로 참여할 수 있어요.</div>
    <button class="red full" id="btnNew">🎁 방 만들기</button></div>`;
  $("#btnNew").onclick = async ()=>{
    const room = randId(10), adminKey = randId(24);
    ls.set("manitto:"+room+":admin", adminKey);
    try {
      await setDoc(doc(fs, `rooms/${room}/meta/game`), {status:"joining", adminHash: await sha(adminKey), createdAt: Date.now(), revealTime:"20:00"});
    } catch(e){ console.error(e); toast("방을 만들지 못했어요. Firebase 설정을 확인해 주세요."); return; }
    location.hash = room;
  };
}

function start(){
  ROOM = (location.hash||"").replace(/^#/,"").replace(/[^a-z0-9]/gi,"");
  if (!ROOM){ landing(); return; }
  const timer = setTimeout(()=>{ if(!(gotG&&gotP)) $("#app").innerHTML = `<div class="card center muted">데이터에 연결하지 못하고 있어요. 잠시 후 새로고침해 주세요.</div>`; }, 10000);
  onSnapshot(R.doc("meta/game"), s=>{
    game = s.exists() ? s.data() : null; gotG=true; if(gotP) clearTimeout(timer);
    if (!game){ $("#app").innerHTML = `<div class="card center"><h2>방을 찾을 수 없어요</h2><div class="muted">링크가 맞는지 확인해 주세요.</div></div>`; return; }
    onData();
  }, e=>{ console.error(e); toast("연결 오류: "+(e.code||"")); });
  onSnapshot(query(R.col("players"), orderBy("joinedAt")), s=>{
    players = s.docs.map(d=>({id:d.id, ...d.data()})); gotP=true; if(gotG) clearTimeout(timer); if (game) onData();
  }, e=>{ console.error(e); toast("연결 오류: "+(e.code||"")); });
}

// 카운트다운 갱신 + 공개 시각이 되면 화면 전환
setInterval(()=>{
  if (!ROOM || !game) return;
  if (status()!==lastEff || guessClosed()!==lastClosed){ onData(); return; }
  const c = $("#count"), rt = revealTime(); if (c && rt) c.innerHTML = countParts(rt);
}, 15000);

window.addEventListener("hashchange", ()=>location.reload());

if (!firebaseConfig.projectId){
  $("#app").innerHTML = `<div class="card"><h2>설정이 필요해요</h2><div class="muted" style="font-size:14px">config.js에 Firebase 설정값을 넣어 주세요. README의 안내를 따라 하면 돼요.</div></div>`;
} else {
  fs = getFirestore(initializeApp(firebaseConfig));
  start();
}
</script>
